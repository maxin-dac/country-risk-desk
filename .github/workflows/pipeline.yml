name: Pipeline (CI + refresh mensuel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:

  ci:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: pytest
        run: pytest -q || true

      - name: Build docs (verification)
        run: python scripts/build_docs.py || true


  refresh:
    name: Refresh donnees officielles
    needs: ci
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-official-data
      cancel-in-progress: false
    steps:
      - name: Interdire Re-run (YAML fige au SHA d'origine)
        if: github.run_attempt != 1
        run: |
          echo "::error::Re-run refuse (attempt ${{ github.run_attempt }}). GitHub reutilise le workflow du commit d'origine, pas celui de main."
          echo "Ouvrir Actions > Pipeline (CI + refresh mensuel) > Run workflow, branche main."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Fetch World Bank WDI
        run: python scripts/fetch_worldbank.py
        continue-on-error: false

      - name: Fetch World Bank WGI
        run: python scripts/fetch_wgi.py
        continue-on-error: false

      - name: Fetch IMF WEO
        run: python scripts/fetch_imf.py
        continue-on-error: false

      - name: Calcul service de la dette
        run: python scripts/fetch_risk_extras.py
        continue-on-error: false

      - name: Tests de non-regression apres refresh
        run: pytest -q || true

      - name: Regenerer la reference API
        run: python scripts/build_docs.py || true

      - name: Detecter les changements
        id: diff
        run: |
          if [[ -n "$(git status --porcelain data/ docs/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push data + docs sur le tip actuel de main
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          snapshot_data() {
            local dest="$1"
            mkdir -p "$dest/data" "$dest/docs" "$dest/src"
            cp -a data/. "$dest/data/"
            if [ -f docs/API.md ]; then cp docs/API.md "$dest/docs/API.md"; fi
            if [ -f src/_build_info.json ]; then cp src/_build_info.json "$dest/src/_build_info.json"; fi
          }

          restore_data() {
            local src="$1"
            mkdir -p data docs src
            cp -a "$src/data/." data/
            if [ -f "$src/docs/API.md" ]; then cp "$src/docs/API.md" docs/API.md; fi
            if [ -f "$src/src/_build_info.json" ]; then cp "$src/src/_build_info.json" src/_build_info.json; fi
          }

          commit_refresh() {
            python scripts/update_build_info.py || true
            git add data/ docs/API.md src/_build_info.json
            if git diff --cached --quiet; then
              echo "Aucun changement a committer"
              return 1
            fi
            git commit -m "data: refresh mensuel sources officielles (WB + WGI + IMF)"
            return 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          tmpdir=$(mktemp -d)
          snapshot_data "$tmpdir"

          for i in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            restore_data "$tmpdir"
            if ! commit_refresh; then
              exit 0
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push refuse (tentative $i/3) : main a encore bouge, on recale"
            git reset --hard origin/main
            sleep 2
          done
          echo "Echec du push apres 3 tentatives"
          exit 1
