name: Versioning automatique (Conventional Commits)

on:
  push:
    branches: [main]
    paths-ignore:
      - "pyproject.toml"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: versioning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Bump version & Release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest -q || true

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-message: "chore(release): {version} [skip ci]"
          preset: "conventionalcommits"
          tag-prefix: "v"
          output-file: "CHANGELOG.md"
          release-count: "0"
          skip-on-empty: "true"
          skip-version-file: "false"
          skip-commit: "false"
          version-file: "./pyproject.toml"
          version-path: "project.version"
          git-user-name: "github-actions[bot]"
          git-user-email: "github-actions[bot]@users.noreply.github.com"

      - name: Extraire la version finale depuis pyproject.toml
        if: steps.changelog.outputs.skipped != 'true'
        id: bump
        run: |
          VERSION=$(python - <<'PY'
          import re, pathlib
          p = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          m = re.search(r'^\s*version\s*=\s*"([^"]+)"', p, re.MULTILINE)
          print(m.group(1) if m else "0.1.0")
          PY
          )
          TAG="v${VERSION}"
          echo "new_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "=== Nouvelle version : ${TAG} ==="

      - name: Extraire le corps du changelog pour la release
        if: steps.changelog.outputs.skipped != 'true'
        id: changelog_body
        run: |
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"## \[?\d+\.\d+\.\d+\]?.*?\n(.*?)(?=\n## |\Z)", text, re.DOTALL)
          body = match.group(1).strip() if match else "_Mise à jour automatique via Conventional Commits._"
          pathlib.Path("/tmp/release_body.md").write_text(body, encoding="utf-8")
          print(body[:4000])
          PY

      - name: Create GitHub Release
        if: steps.changelog.outputs.skipped != 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.bump.outputs.new_tag }}
          release_name: "Release ${{ steps.bump.outputs.new_tag }}"
          body_path: /tmp/release_body.md
          draft: false
          prerelease: false

      - name: Résumé (skip)
        if: steps.changelog.outputs.skipped == 'true'
        run: |
          echo "⚠️  Aucun commit conventionnel détecté depuis la dernière release."
          echo "   → Aucun bump de version, aucun tag, aucune release créée."
