[project]
name = "country-risk-desk"
version = "0.5.0"
description = "Tableau de bord d'analyse du risque pays souverain (notation, macro, scoring d'alerte)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Maxime NDACLEU", email = "contact@countryriskdesk.fr" }
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Visualization"
]
dependencies = [
  "streamlit>=1.36",
  "pandas>=2.2",
  "xhtml2pdf>=0.2.16",
  "requests>=2.32",
  "babel>=2.14.0",
  "pycountry>=23.12.11",
  "plotly>=5.18.0",
  "python-dotenv>=1.0.1",
  "openpyxl>=3.1.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
country-risk-desk = "app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
src = ["*.py"]

[tool.versionrc]
types = [
  { type = "feat", section = "✨ Nouveautés", hidden = false },
  { type = "feature", section = "✨ Nouveautés", hidden = false },
  { type = "fix", section = "🐛 Corrections", hidden = false },
  { type = "perf", section = "⚡ Performances", hidden = false },
  { type = "refactor", section = "♻️ Refactoring", hidden = false },
  { type = "docs", section = "📚 Documentation", hidden = false },
  { type = "test", section = "🧪 Tests", hidden = false },
  { type = "build", section = "🏗️ Build", hidden = false },
  { type = "ci", section = "🔧 CI/CD", hidden = false },
  { type = "chore", section = "📦 Chores", hidden = true },
  { type = "data", section = "📊 Données", hidden = false },
  { type = "style", section = "🎨 Style", hidden = true },
  { type = "revert", section = "↩️ Retours en arrière", hidden = false }
]
tagPrefix = "v"
commitUrlFormat = "{{host}}/{{owner}}/{{repository}}/commit/{{hash}}"
compareUrlFormat = "{{host}}/{{owner}}/{{repository}}/compare/{{previousTag}}...{{currentTag}}"
issueUrlFormat = "{{host}}/{{owner}}/{{repository}}/issues/{{id}}"
releaseCommitMessageFormat = "chore(release): {{currentTag}} [skip ci]"
