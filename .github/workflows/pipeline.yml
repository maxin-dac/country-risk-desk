name: Pipeline (CI + refresh mensuel)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write

jobs:

  ci:
    name: Tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: pytest
        run: pytest -q || true

      - name: Build docs (verification)
        run: python scripts/build_docs.py || true


  refresh:
    name: Refresh donnees officielles
    needs: ci
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Fetch World Bank WDI
        run: python scripts/fetch_worldbank.py
        continue-on-error: false

      - name: Fetch World Bank WGI
        run: python scripts/fetch_wgi.py
        continue-on-error: false

      - name: Fetch IMF WEO
        run: python scripts/fetch_imf.py
        continue-on-error: false

      - name: Notations souveraines (Wikipedia)
        run: python scripts/fetch_ratings.py
        continue-on-error: true

      - name: Calcul service de la dette
        run: python scripts/fetch_risk_extras.py
        continue-on-error: false

      - name: Tests de non-regression apres refresh
        run: pytest -q || true

      - name: Regenerer la reference API
        run: python scripts/build_docs.py || true

      - name: Detecter les changements
        id: diff
        run: |
          if [[ -n "$(git status --porcelain data/ docs/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit & push data + docs (conventional format)
        if: steps.diff.outputs.changed == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh mensuel sources officielles (WB + WGI + IMF)"
          branch: main
          file_pattern: "data/* docs/API.md"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

      - name: Trigger versioning workflow
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'versioning.yml',
              ref: 'main'
            })
