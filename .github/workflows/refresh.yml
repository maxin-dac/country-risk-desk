name: refresh-data

on:
  schedule:
    - cron: "0 6 7 * *"   # le 7 de chaque mois, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dependances
        run: pip install -r requirements.txt

      - name: Rafraichissement des donnees
        run: python scripts/refresh_data.py

      - name: Commit & push si changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && { echo "Aucun changement de donnees"; exit 0; }
          git commit -m "data: refresh mensuel automatique (WB/WGI/IMF) [skip ci]"
          git push
